<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跳转中…</title>
<style>
  html,body{height:100%;margin:0;background:#0f1115;color:#e6e6e6;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 18px;box-sizing:border-box}
  .dot{width:10px;height:10px;border-radius:50%;background:#4ea1ff;
    box-shadow:0 0 0 0 rgba(78,161,255,.6);animation:p 1.2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(78,161,255,.5)}70%{box-shadow:0 0 0 14px rgba(78,161,255,0)}100%{box-shadow:0 0 0 0 rgba(78,161,255,0)}}
  a{color:#4ea1ff}
  .hint{font-size:14px;color:#8a8f98;max-width:78vw;text-align:center;word-break:break-all}
  .go{display:none;font-size:17px;padding:12px 22px;border:1px solid #4ea1ff;border-radius:999px;color:#4ea1ff;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot"></div>
  <div>正在跳转…</div>
  <div class="hint" id="hint"></div>
  <a class="go" id="go" href="#">点这里手动进入</a>
</div>
<script>
(function(){
  var hint = document.getElementById('hint');
  var go = document.getElementById('go');
  var KEY = 'tiaodata_last_good';
  var BUILTIN = 'https://watched-investors-mandatory-faced.trycloudflare.com';
  var jumped = false;

  function showManual(u, why){
    if (jumped) return;
    hint.textContent = why;
    if (u) { go.href = u; go.style.display = 'inline-block'; }
  }

  function tryJump(u){
    if (jumped || !u) return;
    if (!/^https?:\/\//.test(u)) return;
    jumped = true;
    try { localStorage.setItem(KEY, u); } catch(e){}
    location.replace(u);
  }

  function attempt(n){
    var sep = n === 0 ? '' : '&r=' + n;
    fetch('target.txt?t=' + Date.now() + sep, {cache:'no-store'})
      .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
      .then(function(t){
        var u = (t || '').trim().split(/\s+/)[0] || '';
        if (/^https?:\/\//.test(u)) {
          hint.textContent = u;
          setTimeout(function(){ tryJump(u); }, 250);
        } else {
          throw new Error('empty target');
        }
      })
      .catch(function(){
        if (n < 2) { setTimeout(function(){ attempt(n + 1); }, 700); return; }
        var last = null;
        try { last = localStorage.getItem(KEY); } catch(e){}
        var back = last || BUILTIN;
        if (back) {
          showManual(back, '新地址没读到，先用内置的：');
          setTimeout(function(){ tryJump(back); }, 1200);
        } else {
          showManual('', '读不到地址，刷新一下。');
        }
      });
  }

  attempt(0);
  setTimeout(function(){
    if (!jumped) {
      var last = null;
      try { last = localStorage.getItem(KEY); } catch(e){}
      var b2 = last || BUILTIN;
    showManual(b2, b2 ? '还没跳过去，点下面直接进：' : '还没跳过去，刷新一下。');
    }
  }, 6000);
})();
</script>
</body>
</html>
