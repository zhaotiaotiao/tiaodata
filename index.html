<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跳转中…</title>
<style>
  html,body{height:100%;margin:0;background:#0f1115;color:#e6e6e6;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:#4ea1ff;
    box-shadow:0 0 0 0 rgba(78,161,255,.6);animation:p 1.2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(78,161,255,.5)}70%{box-shadow:0 0 0 14px rgba(78,161,255,0)}100%{box-shadow:0 0 0 0 rgba(78,161,255,0)}}
  a{color:#4ea1ff}
  .hint{font-size:14px;color:#8a8f98;max-width:78vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot"></div>
  <div>正在跳转…</div>
  <div class="hint" id="hint"></div>
</div>
<script>
(function(){
  var hint = document.getElementById('hint');
  fetch('target.txt?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var u = (t || '').trim().split(/\s+/)[0];
      if (u && /^https?:\/\//.test(u)) {
        hint.textContent = u;
        setTimeout(function(){ location.replace(u); }, 400);
      } else {
        hint.textContent = '地址没配好，找老大。';
      }
    })
    .catch(function(){ hint.textContent = '读不到地址，刷新一下。'; });
})();
</script>
</body>
</html>
